<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.4em;
      display: flex;
      justify-content: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 600px;
      height: 400px;
    }

    header h1 {
      font-size: 50px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    form section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    form section label {
      font-size: 30px;
    }

    form section button {
      width: 100px;
      height: 40px;
      font-size: 24px;
      align-self: center;
      margin-top: 20px;
    }

    form section input {
      font-size: 24px;
      width: 400px;
      height: 40px;
      padding: 5px;
    }
  </style>

</head>
<body>
  <main>
    <header>
      <h1>Login</h1>
    </header>
    <form action="/login" method="post">
      <section>
        <label for="name">Username</label>
        <input type="text" name="username" placeholder="Username">
      </section>
      <section>
        <label for="password">Password</label>
        <input type="password" name="password" placeholder="Password">
      </section>
      <section>
        <button type="submit">Login</button>
      </section>
    </form>


  </main>
</body>
</html>
